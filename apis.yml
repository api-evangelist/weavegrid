aid: weavegrid
name: WeaveGrid
description: >-
  WeaveGrid builds grid-orchestration software that lets electric utilities absorb rapid EV and
  distributed-energy load growth without overbuilding the distribution system. Its DISCO
  (Distribution-Integrated System Capacity Orchestration) platform ingests vehicle telematics and
  cloud-connected device data, then sends hyper-local, individualized charging and dispatch signals to
  EVs, home batteries, smart thermostats and other flexible loads so they respond to real constraints at
  the transformer, feeder and substation level. The company runs managed-charging and time-of-use
  programs for utilities including Pacific Gas and Electric, Dominion Energy, DTE, Xcel Energy,
  Baltimore Gas and Electric, Alabama Power, Ameren Illinois and Portland General Electric, and
  integrates directly with OEM and device partners such as Toyota, Lexus, Rivian, Hyundai, Kia,
  ChargePoint, Wallbox, Emporia, SolarEdge, FranklinWH and ecobee. WeaveGrid markets a partner API for
  aggregators, but publishes no public developer portal, reference or machine-readable specification.
