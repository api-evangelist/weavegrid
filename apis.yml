apis:
- aid: weavegrid-partner-api
  name: WeaveGrid Partner API
  description: >-
    WeaveGrid markets a partner API that lets aggregators, OEMs and device manufacturers align their
    software stack with electric utilities and participate in WeaveGrid-operated grid programs. The
    production host api.weavegrid.com serves a FastAPI application (server header "uvicorn", first-party
    "x-wg-log-session" response header) whose generated OpenAPI document is present at /openapi.json and
    its Swagger UI at /docs, but both answer HTTP 401 with "WWW-Authenticate: Basic". No public
    reference, portal or specification is published; access is obtained through the "Become a partner"
    contact form.
  humanURL: https://www.weavegrid.com/partners
